<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=240, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Metals Spot</title>

<style>
  html, body {
    width: 240px;
    height: 240px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000000;
    color: #ffffff;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }

  .frame {
    width: 240px;
    height: 240px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 13px;
    padding: 10px 8px 20px;
    box-sizing: border-box;
    text-align: center;
  }

  .block {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .label {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.06em;
    opacity: 0.8;
    line-height: 1;
    margin-bottom: 3px;
  }

  .price-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }

  .price {
    font-size: 46px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    white-space: nowrap;
  }

  #gold {
    color: #FFD700;
  }

  #silver {
    color: #C0C0C0;
  }

  .arrow {
    min-width: 22px;
    font-size: 21px;
    font-weight: 900;
    line-height: 0.75;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .arrow.up {
    color: #39ff88;
  }

  .arrow.down {
    color: #ff4d4d;
  }

  .arrow.flat {
    color: #777777;
  }

  .ratio {
    font-size: 46px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    white-space: nowrap;
  }

  .ratio.gold {
    color: #FFD700;
  }

  .ratio.silver {
    color: #C0C0C0;
  }

  .ratio.white {
    color: #FFFFFF;
  }

  .footer {
    position: absolute;
    bottom: 5px;
    left: 10px;
    right: 10px;
    font-size: 10px;
    display: flex;
    justify-content: space-between;
    color: rgba(255,255,255,0.4);
  }

  .status.ok {
    color: #5cffb3;
  }

  .status.err {
    color: #ff6b6b;
  }
</style>
</head>

<body>

<div class="frame">

  <div class="block">
    <div class="label">Gold</div>
    <div class="price-row">
      <div class="price" id="gold">—</div>
      <div class="arrow flat" id="goldArrow">•</div>
    </div>
  </div>

  <div class="block">
    <div class="label">Silver</div>
    <div class="price-row">
      <div class="price" id="silver">—</div>
      <div class="arrow flat" id="silverArrow">•</div>
    </div>
  </div>

  <div class="ratio white" id="ratio">G/S —</div>

</div>

<div class="footer">
  <div id="status" class="status">Loading</div>
  <div id="updated">--:--</div>
</div>

<script>

  const API = {
    gold: "https://api.gold-api.com/price/XAU",
    silver: "https://api.gold-api.com/price/XAG"
  };

  const COMEX = {
    gold:
      "https://query1.finance.yahoo.com/v8/finance/chart/GC%3DF?range=5d&interval=1d",
    silver:
      "https://query1.finance.yahoo.com/v8/finance/chart/SI%3DF?range=5d&interval=1d"
  };

  const REFRESH_MS = 15000;
  const CLOSE_REFRESH_MS = 15 * 60 * 1000;
  const BIG_MOVE_THRESHOLD = 10;

  const elGold = document.getElementById("gold");
  const elSilver = document.getElementById("silver");
  const elGoldArrow = document.getElementById("goldArrow");
  const elSilverArrow = document.getElementById("silverArrow");
  const elRatio = document.getElementById("ratio");
  const elStatus = document.getElementById("status");
  const elUpdated = document.getElementById("updated");

  let previousClose = {
    gold: null,
    silver: null
  };

  let currentSpot = {
    gold: null,
    silver: null
  };

  const goldUSD = new Intl.NumberFormat("en-US", {
    style: "currency",
    currency: "USD",
    maximumFractionDigits: 0
  });

  const silverUSD = new Intl.NumberFormat("en-US", {
    style: "currency",
    currency: "USD",
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });

  function setStatus(text, ok = true) {
    elStatus.textContent = text;
    elStatus.classList.toggle("ok", ok);
    elStatus.classList.toggle("err", !ok);
  }

  function setTime(iso) {
    if (!iso) return;

    const d = new Date(iso);

    elUpdated.textContent = d.toLocaleTimeString([], {
      hour: "2-digit",
      minute: "2-digit"
    });
  }

  /*
    Spot-price fetch.
    This intentionally stays simple because
    this is the version already known to work.
  */
  async function getSpotJSON(url) {
    const res = await fetch(url, {
      cache: "no-store"
    });

    if (!res.ok) {
      throw new Error("HTTP " + res.status);
    }

    return res.json();
  }

  /*
    Separate futures fetch.
    Failure here cannot stop spot prices.
  */
  async function getFuturesJSON(url) {
    const separator = url.includes("?") ? "&" : "?";

    const res = await fetch(
      url + separator + "_=" + Date.now(),
      {
        cache: "no-store"
      }
    );

    if (!res.ok) {
      throw new Error("HTTP " + res.status);
    }

    return res.json();
  }

  function setRatioColor(ratio) {
    elRatio.classList.remove(
      "gold",
      "silver",
      "white"
    );

    if (ratio <= 60) {
      elRatio.classList.add("gold");
    } else if (ratio > 85) {
      elRatio.classList.add("silver");
    } else {
      elRatio.classList.add("white");
    }
  }

  function updateArrow(
    element,
    currentPrice,
    previousPrice
  ) {
    element.classList.remove(
      "up",
      "down",
      "flat"
    );

    if (
      typeof currentPrice !== "number" ||
      typeof previousPrice !== "number" ||
      previousPrice === 0
    ) {
      element.textContent = "•";
      element.classList.add("flat");
      return;
    }

    const percentMove =
      ((currentPrice - previousPrice) / previousPrice) * 100;

    const bigMove =
      Math.abs(percentMove) > BIG_MOVE_THRESHOLD;

    if (percentMove > 0) {
      element.innerHTML = bigMove
        ? "<span>▲</span><span>▲</span>"
        : "<span>▲</span>";

      element.classList.add("up");

    } else if (percentMove < 0) {
      element.innerHTML = bigMove
        ? "<span>▼</span><span>▼</span>"
        : "<span>▼</span>";

      element.classList.add("down");

    } else {
      element.textContent = "•";
      element.classList.add("flat");
    }
  }

  /*
    SPOT REFRESH

    This is the important part:
    it does NOT wait for Yahoo/COMEX.
  */
  async function refreshSpot() {
    try {
      setStatus("Live", true);

      const [gold, silver] = await Promise.all([
        getSpotJSON(API.gold),
        getSpotJSON(API.silver)
      ]);

      currentSpot.gold = gold.price;
      currentSpot.silver = silver.price;

      elGold.textContent =
        goldUSD.format(gold.price);

      elSilver.textContent =
        silverUSD.format(silver.price);

      const ratio =
        gold.price / silver.price;

      elRatio.textContent =
        "G/S " + Math.round(ratio);

      setRatioColor(ratio);

      updateArrow(
        elGoldArrow,
        currentSpot.gold,
        previousClose.gold
      );

      updateArrow(
        elSilverArrow,
        currentSpot.silver,
        previousClose.silver
      );

      const newest =
        [gold.updatedAt, silver.updatedAt]
          .filter(Boolean)
          .sort()
          .pop();

      setTime(newest);

    } catch (e) {
      console.error(
        "Spot price error:",
        e
      );

      setStatus(
        "Error",
        false
      );
    }
  }

  function extractPreviousClose(data) {
    const result =
      data?.chart?.result?.[0];

    if (!result) {
      throw new Error(
        "No futures result"
      );
    }

    let close =
      result.meta?.chartPreviousClose;

    if (typeof close !== "number") {
      close =
        result.meta?.previousClose;
    }

    if (typeof close === "number") {
      return close;
    }

    const closes =
      result
        ?.indicators
        ?.quote?.[0]
        ?.close
        ?.filter(
          value =>
            typeof value === "number"
        );

    if (
      closes &&
      closes.length >= 2
    ) {
      return closes[
        closes.length - 2
      ];
    }

    throw new Error(
      "Previous close unavailable"
    );
  }

  /*
    COMEX / FUTURES REFRESH

    Completely separate from spot refresh.
  */
  async function refreshPreviousClose() {
    try {
      const results =
        await Promise.allSettled([
          getFuturesJSON(COMEX.gold),
          getFuturesJSON(COMEX.silver)
        ]);

      if (
        results[0].status === "fulfilled"
      ) {
        try {
          previousClose.gold =
            extractPreviousClose(
              results[0].value
            );
        } catch (e) {
          console.error(
            "Gold close parse error:",
            e
          );
        }
      }

      if (
        results[1].status === "fulfilled"
      ) {
        try {
          previousClose.silver =
            extractPreviousClose(
              results[1].value
            );
        } catch (e) {
          console.error(
            "Silver close parse error:",
            e
          );
        }
      }

      /*
        Save whatever successfully loaded.
      */
      if (
        typeof previousClose.gold === "number" ||
        typeof previousClose.silver === "number"
      ) {
        try {
          localStorage.setItem(
            "comexPreviousClose",
            JSON.stringify(
              previousClose
            )
          );
        } catch (_) {}
      }

    } catch (e) {
      console.error(
        "COMEX refresh error:",
        e
      );
    }

    /*
      Re-render arrows using whatever
      close data we successfully have.
    */
    updateArrow(
      elGoldArrow,
      currentSpot.gold,
      previousClose.gold
    );

    updateArrow(
      elSilverArrow,
      currentSpot.silver,
      previousClose.silver
    );
  }

  /*
    Load saved close immediately.
  */
  try {
    const saved =
      JSON.parse(
        localStorage.getItem(
          "comexPreviousClose"
        )
      );

    if (saved) {
      if (
        typeof saved.gold === "number"
      ) {
        previousClose.gold =
          saved.gold;
      }

      if (
        typeof saved.silver === "number"
      ) {
        previousClose.silver =
          saved.silver;
      }
    }
  } catch (_) {}

  /*
    IMPORTANT:

    Spot prices start immediately.
    They do not wait for COMEX.
  */
  refreshSpot();

  /*
    COMEX lookup starts separately.
  */
  refreshPreviousClose();

  /*
    Live spot every 15 sec.
  */
  setInterval(
    refreshSpot,
    REFRESH_MS
  );

  /*
    Previous close every 15 min.
  */
  setInterval(
    refreshPreviousClose,
    CLOSE_REFRESH_MS
  );

</script>

</body>
</html>
