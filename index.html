<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=240, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Metals Spot</title>

<style>
  html, body {
    width: 240px;
    height: 240px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000000;
    color: #ffffff;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }

  .frame {
    width: 240px;
    height: 240px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 13px;
    padding: 10px 8px 20px;
    box-sizing: border-box;
    text-align: center;
  }

  .block {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .label {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.06em;
    opacity: 0.8;
    line-height: 1;
    margin-bottom: 3px;
  }

  /* Main price styling */
  .price {
    font-size: 46px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    white-space: nowrap;
  }

  /* Gold price */
  #gold {
    color: #FFD700;
  }

  /* Silver price */
  #silver {
    color: #C0C0C0;
  }

  /* Gold/Silver ratio */
  .ratio {
    font-size: 46px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    white-space: nowrap;
    color: #FFFFFF;
  }

  /* G/S ratio 60 or below */
  .ratio.gold {
    color: #FFD700;
  }

  /* G/S ratio above 85 */
  .ratio.silver {
    color: #C0C0C0;
  }

  /* G/S ratio between 60 and 85 */
  .ratio.white {
    color: #FFFFFF;
  }

  .footer {
    position: absolute;
    bottom: 5px;
    left: 10px;
    right: 10px;
    font-size: 10px;
    display: flex;
    justify-content: space-between;
    color: rgba(255,255,255,0.4);
  }

  .status.ok {
    color: #5cffb3;
  }

  .status.err {
    color: #ff6b6b;
  }
</style>
</head>

<body>

  <div class="frame">

    <!-- GOLD -->
    <div class="block">
      <div class="label">Gold</div>
      <div class="price" id="gold">—</div>
    </div>

    <!-- SILVER -->
    <div class="block">
      <div class="label">Silver</div>
      <div class="price" id="silver">—</div>
    </div>

    <!-- GOLD / SILVER RATIO -->
    <div class="ratio white" id="ratio">G/S —</div>

  </div>

  <div class="footer">
    <div id="status" class="status">Loading</div>
    <div id="updated">--:--</div>
  </div>

<script>

  const API = {
    gold: "https://api.gold-api.com/price/XAU",
    silver: "https://api.gold-api.com/price/XAG"
  };

  // Refresh API every 15 seconds
  const REFRESH_MS = 15000;

  const elGold = document.getElementById("gold");
  const elSilver = document.getElementById("silver");
  const elRatio = document.getElementById("ratio");
  const elStatus = document.getElementById("status");
  const elUpdated = document.getElementById("updated");

  /*
    GOLD
    Display nearest whole dollar.
  */
  const goldUSD = new Intl.NumberFormat("en-US", {
    style: "currency",
    currency: "USD",
    maximumFractionDigits: 0
  });

  /*
    SILVER
    Display two decimal places.
  */
  const silverUSD = new Intl.NumberFormat("en-US", {
    style: "currency",
    currency: "USD",
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });

  function setStatus(text, ok = true) {

    elStatus.textContent = text;

    elStatus.classList.toggle("ok", ok);
    elStatus.classList.toggle("err", !ok);
  }

  function setTime(iso) {

    if (!iso) return;

    const d = new Date(iso);

    elUpdated.textContent =
      d.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      });
  }

  async function getJSON(url) {

    const res =
      await fetch(url, {
        cache: "no-store"
      });

    if (!res.ok) {
      throw new Error(
        "HTTP " + res.status
      );
    }

    return res.json();
  }

  /*
    Change G/S ratio color:

    60 or below = GOLD
    Above 60 through 85 = WHITE
    Above 85 = SILVER
  */
  function setRatioColor(ratio) {

    elRatio.classList.remove(
      "gold",
      "silver",
      "white"
    );

    if (ratio <= 60) {

      elRatio.classList.add("gold");

    } else if (ratio > 85) {

      elRatio.classList.add("silver");

    } else {

      elRatio.classList.add("white");

    }
  }

  async function refresh() {

    try {

      setStatus("Live", true);

      /*
        Fetch Gold + Silver simultaneously
      */
      const [gold, silver] =
        await Promise.all([

          getJSON(API.gold),

          getJSON(API.silver)

        ]);

      /*
        GOLD
        Nearest whole dollar
      */
      elGold.textContent =
        goldUSD.format(
          gold.price
        );

      /*
        SILVER
        Keep cents
      */
      elSilver.textContent =
        silverUSD.format(
          silver.price
        );

      /*
        GOLD / SILVER RATIO

        IMPORTANT:
        Calculation uses the FULL
        unrounded API prices.
      */
      const ratio =
        gold.price /
        silver.price;

      /*
        Display nearest whole ratio.
      */
      elRatio.textContent =
        "G/S " +
        Math.round(ratio);

      /*
        Apply ratio color.
      */
      setRatioColor(ratio);

      /*
        Use newest API timestamp.
      */
      const newest =
        [
          gold.updatedAt,
          silver.updatedAt
        ]
        .filter(Boolean)
        .sort()
        .pop();

      setTime(newest);

    }

    catch (e) {

      console.error(e);

      setStatus(
        "Error",
        false
      );

    }
  }

  /*
    Load immediately
  */
  refresh();

  /*
    Then update every 15 seconds
  */
  setInterval(
    refresh,
    REFRESH_MS
  );

</script>

</body>
</html>
