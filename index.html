<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=240, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Metals Spot</title>

<style>
  html, body {
    width: 240px;
    height: 240px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000000;
    color: #ffffff;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }

  .frame {
    width: 240px;
    height: 240px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 13px;
    padding: 10px 8px 20px;
    box-sizing: border-box;
    text-align: center;
  }

  .block {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .label {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.06em;
    opacity: 0.8;
    line-height: 1;
    margin-bottom: 3px;
  }

  /* Gold & Silver prices */
  .price {
    font-size: 46px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    white-space: nowrap;
  }

  /* Gold/Silver ratio — same size and brightness */
  .ratio {
    font-size: 46px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    color: #ffffff;
    white-space: nowrap;
  }

  .footer {
    position: absolute;
    bottom: 5px;
    left: 10px;
    right: 10px;
    font-size: 10px;
    display: flex;
    justify-content: space-between;
    color: rgba(255,255,255,0.4);
  }

  .status.ok { color: #5cffb3; }
  .status.err { color: #ff6b6b; }
</style>
</head>

<body>

  <div class="frame">

    <div class="block">
      <div class="label">Gold</div>
      <div class="price" id="gold">—</div>
    </div>

    <div class="block">
      <div class="label">Silver</div>
      <div class="price" id="silver">—</div>
    </div>

    <div class="ratio" id="ratio">G/S —</div>

  </div>

  <div class="footer">
    <div id="status" class="status">Loading</div>
    <div id="updated">--:--</div>
  </div>

<script>

  const API = {
    gold: "https://api.gold-api.com/price/XAU",
    silver: "https://api.gold-api.com/price/XAG"
  };

  const REFRESH_MS = 15000;

  const elGold = document.getElementById("gold");
  const elSilver = document.getElementById("silver");
  const elRatio = document.getElementById("ratio");
  const elStatus = document.getElementById("status");
  const elUpdated = document.getElementById("updated");

  // Gold — whole dollars
  const goldUSD = new Intl.NumberFormat("en-US", {
    style: "currency",
    currency: "USD",
    maximumFractionDigits: 0
  });

  // Silver — two decimal places
  const silverUSD = new Intl.NumberFormat("en-US", {
    style: "currency",
    currency: "USD",
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });

  function setStatus(text, ok=true) {
    elStatus.textContent = text;
    elStatus.classList.toggle("ok", ok);
    elStatus.classList.toggle("err", !ok);
  }

  function setTime(iso) {
    if (!iso) return;

    const d = new Date(iso);

    elUpdated.textContent = d.toLocaleTimeString([], {
      hour: "2-digit",
      minute: "2-digit"
    });
  }

  async function getJSON(url) {
    const res = await fetch(url, {
      cache: "no-store"
    });

    if (!res.ok)
      throw new Error("HTTP " + res.status);

    return res.json();
  }

  async function refresh() {

    try {

      setStatus("Live", true);

      const [gold, silver] = await Promise.all([
        getJSON(API.gold),
        getJSON(API.silver)
      ]);

      elGold.textContent =
        goldUSD.format(gold.price);

      elSilver.textContent =
        silverUSD.format(silver.price);

      const ratio =
        gold.price / silver.price;

      elRatio.textContent =
        "G/S " + ratio.toFixed(1);

      const newest =
        [gold.updatedAt, silver.updatedAt]
        .filter(Boolean)
        .sort()
        .pop();

      setTime(newest);

    } catch (e) {

      console.error(e);
      setStatus("Error", false);

    }
  }

  refresh();
  setInterval(refresh, REFRESH_MS);

</script>

</body>
</html>
