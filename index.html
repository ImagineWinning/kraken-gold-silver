<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=240, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Metals Spot</title>

<style>
  html, body {
    width: 240px;
    height: 240px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000000;
    color: #ffffff;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }

  .frame {
    width: 240px;
    height: 240px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 13px;
    padding: 10px 8px 20px;
    box-sizing: border-box;
    text-align: center;
  }

  .block {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .label {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.06em;
    opacity: 0.8;
    line-height: 1;
    margin-bottom: 3px;
  }

  .price-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }

  .price {
    font-size: 46px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    white-space: nowrap;
  }

  #gold {
    color: #FFD700;
  }

  #silver {
    color: #C0C0C0;
  }

  .arrow {
    min-width: 22px;
    font-size: 21px;
    font-weight: 900;
    line-height: 0.75;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .arrow.up {
    color: #39ff88;
  }

  .arrow.down {
    color: #ff4d4d;
  }

  .arrow.flat {
    color: #777777;
  }

  .ratio {
    font-size: 46px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    white-space: nowrap;
  }

  .ratio.gold {
    color: #FFD700;
  }

  .ratio.silver {
    color: #C0C0C0;
  }

  .ratio.white {
    color: #FFFFFF;
  }

  .footer {
    position: absolute;
    bottom: 5px;
    left: 10px;
    right: 10px;
    font-size: 10px;
    display: flex;
    justify-content: space-between;
    color: rgba(255,255,255,0.4);
  }

  .status.ok {
    color: #5cffb3;
  }

  .status.err {
    color: #ff6b6b;
  }
</style>
</head>

<body>

<div class="frame">

  <div class="block">
    <div class="label">Gold</div>

    <div class="price-row">
      <div class="price" id="gold">—</div>
      <div class="arrow flat" id="goldArrow">•</div>
    </div>
  </div>

  <div class="block">
    <div class="label">Silver</div>

    <div class="price-row">
      <div class="price" id="silver">—</div>
      <div class="arrow flat" id="silverArrow">•</div>
    </div>
  </div>

  <div class="ratio white" id="ratio">
    G/S —
  </div>

</div>

<div class="footer">
  <div id="status" class="status">Loading</div>
  <div id="updated">--:--</div>
</div>

<script>

  const API = {
    gold: "https://api.gold-api.com/price/XAU",
    silver: "https://api.gold-api.com/price/XAG"
  };

  const COMEX = {
    gold:
      "https://query1.finance.yahoo.com/v8/finance/chart/GC%3DF?range=5d&interval=1d&corsDomain=finance.yahoo.com",

    silver:
      "https://query1.finance.yahoo.com/v8/finance/chart/SI%3DF?range=5d&interval=1d&corsDomain=finance.yahoo.com"
  };

  const REFRESH_MS = 15000;

  const CLOSE_REFRESH_MS =
    15 * 60 * 1000;

  const BIG_MOVE_THRESHOLD = 10;

  const elGold =
    document.getElementById("gold");

  const elSilver =
    document.getElementById("silver");

  const elGoldArrow =
    document.getElementById("goldArrow");

  const elSilverArrow =
    document.getElementById("silverArrow");

  const elRatio =
    document.getElementById("ratio");

  const elStatus =
    document.getElementById("status");

  const elUpdated =
    document.getElementById("updated");

  let previousClose = {
    gold: null,
    silver: null
  };

  const goldUSD =
    new Intl.NumberFormat("en-US", {
      style: "currency",
      currency: "USD",
      maximumFractionDigits: 0
    });

  const silverUSD =
    new Intl.NumberFormat("en-US", {
      style: "currency",
      currency: "USD",
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });

  function setStatus(text, ok = true) {

    elStatus.textContent = text;

    elStatus.classList.toggle(
      "ok",
      ok
    );

    elStatus.classList.toggle(
      "err",
      !ok
    );
  }

  function setTime(iso) {

    if (!iso) return;

    const d =
      new Date(iso);

    elUpdated.textContent =
      d.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      });
  }

  async function getJSON(url) {

    const separator =
      url.includes("?")
        ? "&"
        : "?";

    const requestURL =
      url +
      separator +
      "_=" +
      Date.now();

    const res =
      await fetch(
        requestURL,
        {
          cache: "no-store"
        }
      );

    if (!res.ok) {

      throw new Error(
        "HTTP " +
        res.status
      );
    }

    return res.json();
  }

  async function getPreviousClose(url) {

    const data =
      await getJSON(url);

    const result =
      data?.chart?.result?.[0];

    if (!result) {

      throw new Error(
        "No futures data"
      );
    }

    let close =
      result.meta?.chartPreviousClose;

    if (
      typeof close !== "number"
    ) {

      close =
        result.meta?.previousClose;
    }

    if (
      typeof close !== "number"
    ) {

      const closes =
        result
          ?.indicators
          ?.quote?.[0]
          ?.close
          ?.filter(
            value =>
              typeof value === "number"
          );

      if (
        closes &&
        closes.length >= 2
      ) {

        close =
          closes[
            closes.length - 2
          ];
      }
    }

    if (
      typeof close !== "number"
    ) {

      throw new Error(
        "Previous close unavailable"
      );
    }

    return close;
  }

  async function refreshPreviousClose() {

    try {

      const [
        goldClose,
        silverClose
      ] =
        await Promise.all([

          getPreviousClose(
            COMEX.gold
          ),

          getPreviousClose(
            COMEX.silver
          )
        ]);

      previousClose.gold =
        goldClose;

      previousClose.silver =
        silverClose;

      localStorage.setItem(
        "comexPreviousClose",
        JSON.stringify(
          previousClose
        )
      );

    } catch (e) {

      console.error(
        "COMEX close error:",
        e
      );

      try {

        const saved =
          JSON.parse(
            localStorage.getItem(
              "comexPreviousClose"
            )
          );

        if (
          saved &&
          typeof saved.gold === "number" &&
          typeof saved.silver === "number"
        ) {

          previousClose =
            saved;
        }

      } catch (_) {}
    }
  }

  function updateArrow(
    element,
    currentPrice,
    previousPrice
  ) {

    element.classList.remove(
      "up",
      "down",
      "flat"
    );

    if (
      typeof previousPrice !== "number" ||
      previousPrice === 0
    ) {

      element.textContent = "•";
      element.classList.add("flat");
      return;
    }

    const percentMove =
      ((currentPrice - previousPrice) /
      previousPrice) * 100;

    const bigMove =
      Math.abs(percentMove) > BIG_MOVE_THRESHOLD;

    if (percentMove > 0) {

      element.innerHTML =
        bigMove
          ? "<span>▲</span><span>▲</span>"
          : "<span>▲</span>";

      element.classList.add("up");

    } else if (percentMove < 0) {

      element.innerHTML =
        bigMove
          ? "<span>▼</span><span>▼</span>"
          : "<span>▼</span>";

      element.classList.add("down");

    } else {

      element.textContent = "•";
      element.classList.add("flat");
    }
  }

  function setRatioColor(ratio) {

    elRatio.classList.remove(
      "gold",
      "silver",
      "white"
    );

    if (ratio <= 60) {

      elRatio.classList.add(
        "gold"
      );

    } else if (ratio > 85) {

      elRatio.classList.add(
        "silver"
      );

    } else {

      elRatio.classList.add(
        "white"
      );
    }
  }

  async function refresh() {

    try {

      setStatus(
        "Live",
        true
      );

      const [
        gold,
        silver
      ] =
        await Promise.all([

          getJSON(
            API.gold
          ),

          getJSON(
            API.silver
          )
        ]);

      elGold.textContent =
        goldUSD.format(
          gold.price
        );

      elSilver.textContent =
        silverUSD.format(
          silver.price
        );

      updateArrow(
        elGoldArrow,
        gold.price,
        previousClose.gold
      );

      updateArrow(
        elSilverArrow,
        silver.price,
        previousClose.silver
      );

      const ratio =
        gold.price /
        silver.price;

      elRatio.textContent =
        "G/S " +
        Math.round(ratio);

      setRatioColor(
        ratio
      );

      const newest =
        [
          gold.updatedAt,
          silver.updatedAt
        ]
        .filter(Boolean)
        .sort()
        .pop();

      setTime(
        newest
      );

    } catch (e) {

      console.error(e);

      setStatus(
        "Error",
        false
      );
    }
  }

  refreshPreviousClose()
    .then(refresh);

  setInterval(
    refresh,
    REFRESH_MS
  );

  setInterval(
    refreshPreviousClose,
    CLOSE_REFRESH_MS
  );

</script>

</body>
</html>
